# ==============================================================================
# Smart Energy Monitoring System — Backend Configuration
# ==============================================================================

# Application & Server Settings
spring.application.name=smart-energy-monitoring-system
server.port=8080

# ------------------------------------------------------------------------------
# Secret Management:
# Loads optional local configuration for passwords/credentials if present.
# (application-local.properties is excluded from Git via .gitignore)
# ------------------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

# ------------------------------------------------------------------------------
# MySQL 8 DataSource Configuration
# Connects to the database created in Phase 2: `smart_energy_db`
# Uses environment variables with sensible defaults when running in containers or CI/CD
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_energy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Settings
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=SmartEnergyHikariPool

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# CRITICAL ARCHITECTURAL RULE:
# ddl-auto is explicitly set to 'none'.
# Hibernate is strictly forbidden from creating, altering, or dropping tables.
# Flyway SQL migrations remain the sole authoritative source of truth for the schema.
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Flyway Database Migration Configuration
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------------------------------------------------------------------------------
# Cross-Origin Resource Sharing (CORS) Security Configuration
# Whitelist of authorized frontend client origins (overridable via environment variable)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}

# ------------------------------------------------------------------------------
# JSON Web Token (JWT) Security Configuration
# JWT_SECRET must be supplied via environment variable or deployment configuration.
# The application will fail safely on startup if JWT_SECRET is missing or invalid.
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ------------------------------------------------------------------------------
# Device API-Key Security Configuration (Edge Telemetry Ingestion)
# Configures the shared secret for hardware device SEM-ESP32-001.
# Supplied externally via environment variable in production/deployment.
# ------------------------------------------------------------------------------
app.device.api-key.sem-esp32-001=${DEVICE_API_KEY_SEM_ESP32_001:}
