# ==============================================================================
# Smart Energy Monitoring System — Automated Test Configuration
# Isolated configuration for unit & integration tests
# ==============================================================================

# Application & Server Settings
spring.application.name=smart-energy-monitoring-system
server.port=8080

# Secret Management:
# Loads optional local configuration for local test execution if present.
# (application-local.properties is excluded from Git via .gitignore)
spring.config.import=optional:classpath:application-local.properties

# MySQL 8 DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_energy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=SmartEnergyHikariTestPool

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Cross-Origin Resource Sharing (CORS) Security Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}

# JSON Web Token (JWT) Security Configuration for Tests
# Isolated dummy secret strictly for running automated integration tests
app.jwt.secret=smart-energy-monitoring-test-secret-key-32-chars-minimum
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Device API-Key Security Configuration for Automated Tests
# Isolated dummy key strictly for running automated integration tests
app.device.api-key.sem-esp32-001=test-device-api-key-for-sem-esp32-001-secret-32chars
